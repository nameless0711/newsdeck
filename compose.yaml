name: newsdeck
x-app: &app
  build: .
  image: newsdeck:local
  restart: unless-stopped
  init: true
  env_file: .env
  environment: &env
    DATABASE_URL: postgresql://newsdeck:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/newsdeck
    HOST: 0.0.0.0
    PORT: 3000
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsdeck
      POSTGRES_USER: newsdeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U newsdeck -d newsdeck"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    <<: *app
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [node, --import, tsx, server/worker.ts]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --import, tsx, server/worker-health.ts]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
